name: testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-issue42.txt
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
      # issue42-reproducao
      - name: Reproduzir RQ01-04 nos dados finais
        run: |
          python -m analises.rq01_04
          python -m analises.verificar_issue42
